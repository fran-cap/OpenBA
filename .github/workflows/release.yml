name: Release
# Builds the release flavour on the three platforms, runs the unit tests on that flavour, packages
# each platform (tools/release/package.sh; tools/macos/make_app.sh + make_release_zip.sh), builds
# and signs the Android apk (tools/android.sh build release + sign, the release key from the
# repository's secrets) and, on a `v*` tag, publishes the GitHub release with the CHANGELOG.md
# section of that version as its notes.
#
# Dry run: a manual dispatch (Actions > Release > Run workflow) runs every job but `release`; the
# packages are the run's artifacts. Pull requests do not run it: release builds are for releases.
# The tag must equal `v<CMake VERSION>` (README "Versioning"); the `version` job refuses anything
# else before a single build starts.
#
# Nothing here needs the game (AGENTS.md section 1): the Windows gate and the serializer check stay
# the maintainer's steps before the tag is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  BUILD_JOBS: 4
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 400M
  CCACHE_LAUNCHERS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
jobs:
  version:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: CMake VERSION, tag check, CHANGELOG section
        id: v
        run: |
          VER="$(sed -nE 's/^project\([^)]*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          [ -n "$VER" ] || { echo "no project(... VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          echo "CMake VERSION $VER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            [ "$TAG" = "v$VER" ] || { echo "tag $TAG does not match CMake VERSION $VER (expected v$VER)"; exit 1; }
          else
            TAG="v$VER"
          fi
          python3 tools/release/changelog_section.py "$VER" > notes.md
          echo "--- release notes ($TAG) ---"; cat notes.md
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  windows:
    name: Windows x64 package
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      # The pinned WinLibs GCC (tools/toolchain/install_winlibs.sh), as in ci.yml; the release
      # build reads the committed PGO profile set (perf/pgo/README.md), which only that compiler
      # version can load.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: git unzip
          pacboy: cmake:p ninja:p python:p ccache:p
      - uses: actions/cache@v4
        id: winlibs
        with:
          path: C:/winlibs-gcc16
          key: winlibs-${{ hashFiles('tools/toolchain/install_winlibs.sh') }}
      - name: Pinned compiler
        if: steps.winlibs.outputs.cache-hit != 'true'
        run: tools/toolchain/install_winlibs.sh C:/winlibs-gcc16
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-windows-${{ github.sha }}
          restore-keys: ccache-release-windows-
      - name: Build OpenBA (release, PGO)
        run: |
          ls perf/pgo/profile/*.gcda | wc -l
          CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/build.sh build release
          grep -q '^BANISHED_PGO:STRING=auto$' build/cmake-release/CMakeCache.txt
      - name: Unit tests (release)
        run: tools/build.sh unit release
      - name: Package
        run: tools/release/package.sh windows "${{ needs.version.outputs.version }}" dist
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  linux:
    name: Linux x64 package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libegl-dev \
            libdecor-0-dev libasound2-dev libpulse-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-linux-${{ github.sha }}
          restore-keys: ccache-release-linux-
      - name: Build OpenBA (release)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/build.sh build release
      - name: Unit tests (release)
        run: tools/build.sh unit release
      - name: Package
        run: tools/release/package.sh linux "${{ needs.version.outputs.version }}" dist
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  macos:
    name: macOS arm64 package
    needs: version
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Packages
        run: brew install ninja ccache meson
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-macos-${{ github.sha }}
          restore-keys: ccache-release-macos-
      # The shader converter (libairconv.dylib: DXMT + a partial LLVM 15 build) is the slow part of
      # tools/macos/setup_deps.sh; cached under that script's hash, so a pin change rebuilds it.
      - uses: actions/cache@v4
        with:
          path: |
            third_party/dxmt_src
            third_party/llvm15_arm64
            third_party/airconv_build
          key: airconv-${{ hashFiles('tools/macos/setup_deps.sh') }}
      - name: App bundle (release)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/macos/make_app.sh dist/OpenBA.app
      - name: Release zip
        run: |
          tools/macos/make_release_zip.sh dist/OpenBA.app dist
          VER="${{ needs.version.outputs.version }}"
          mv dist/OpenBA-mac-arm64.zip "dist/OpenBA-v$VER-mac-arm64.zip"
          rm -f dist/OpenBA-mac-arm64.zip.sha256
          (cd dist && shasum -a 256 "OpenBA-v$VER-mac-arm64.zip" > "OpenBA-v$VER-mac-arm64.zip.sha256" && cat "OpenBA-v$VER-mac-arm64.zip.sha256")
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The signed Android apk (docs/android/README.md "Release"). The pins are android/app/build.gradle's
  # and docs/android/README.md's: NDK r30, the SDK's CMake 3.31.6, platform 35, build-tools 36.0.0
  # (zipalign -P 16, apksigner); Gradle 8.12.1 comes from the wrapper, AGP 8.8.1 from android/.
  # Signing is a step of its own, after the build: the keystore and its passwords never reach Gradle,
  # the native build or the caches, and the build is the same command as on the maintainer's machine.
  # The keystore is decoded to the runner's temp folder (outside the workspace, removed on exit); the
  # passwords reach apksigner through the environment (`env:`), never a command line; the secrets are
  # masked in the log and no step runs with `set -x`.
  android:
    name: Android arm64 apk (signed)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_NDK_PIN: "30.0.16248370"
      ANDROID_CMAKE_PIN: "3.31.6"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_PLATFORM_PIN: "android-35"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache
      # The runner image's SDK (ANDROID_HOME) with the pinned packages added; build.gradle names the
      # NDK and CMake versions, so Gradle takes these and never the image's own.
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;$ANDROID_PLATFORM_PIN" "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_PIN" "cmake;$ANDROID_CMAKE_PIN" > /dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/build-tools"
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-android-${{ github.sha }}
          restore-keys: ccache-release-android-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-
      - name: Build the apk (release = the perf flavour, unsigned)
        run: tools/android.sh build release --jobs "$BUILD_JOBS" --ccache
      - name: Sign (zipalign -P 16, apksigner, verify)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENBA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENBA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENBA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set +x
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$OPENBA_KEYSTORE_PASSWORD" ] || [ -z "$OPENBA_KEY_ALIAS" ] || \
             [ -z "$OPENBA_KEY_PASSWORD" ]; then
            echo "::error::the four ANDROID_* signing secrets are not all set"
            exit 1
          fi
          umask 077
          export OPENBA_KEYSTORE="$RUNNER_TEMP/openba-release.keystore"
          trap 'rm -f "$OPENBA_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$OPENBA_KEYSTORE"
          unset KEYSTORE_BASE64
          APK="OpenBA-v$VER-android-arm64.apk"
          mkdir -p dist
          tools/android.sh sign android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256" && cat "$APK.sha256")
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, linux, macos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -lR artifacts
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenBA $TAG" --notes-file artifacts/release-notes/notes.md \
            artifacts/package-windows/* artifacts/package-linux/* artifacts/package-macos/* \
            artifacts/package-android/*
