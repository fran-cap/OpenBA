name: CI
# Build + unit tests on the three platforms, the no-doors acceptance check, and the Android debug apk
# (built, not run; not a required check). Nothing here needs the game: retail data is never on a
# runner (AGENTS.md section 1), so the gameplay gate
# (tools/build.sh run) and the serializer check (tools/resave_gate/) stay maintainer steps.
# Unit tests that read the user's install (xwma_decode_test) skip when it is absent.
#
# ccache: each build job restores the newest cache of its own job (a PR reads main's), compiles
# through ccache and saves a fresh one. CMakeLists.txt puts ccache on C++ when it is on PATH; the C
# (SDL, FreeType, wmadec) and Objective-C++ launchers come from CCACHE_LAUNCHERS below.
# CCACHE_NOHASHDIR: a -g compile otherwise hashes its working directory (the build directory, which
# the debug info names), so the Windows job's second configure (build/cmake-debug-vulkan) hit nothing
# of the first's: 24 hits in 2998 on a cold run. Without it the objects' debug info names whichever
# build directory compiled them first, which nothing here reads.
# `ccache -z` runs after the cache restore: the restored directory carries the stats of the run that saved
# it, so zeroing before the restore made `ccache -s` report every run's hits added together.
#
# Unit tests run on parallel workers (`tools/build.sh unit --shards N`, one per runner core: 4 on the
# Windows and Linux runners, 3 on macos-15 arm64). The suite is ~1800 tests and a few take 5-20 s each,
# so one process left the other cores idle for most of the step; the step also prints the slowest tests.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BUILD_JOBS: 4
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_LAUNCHERS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
jobs:
  windows:
    name: Windows (MSYS2 UCRT64)   # the required-check name: kept, though the job no longer installs MSYS2
    runs-on: windows-latest
    timeout-minutes: 60
    # Git Bash (the runner's Git for Windows) is the shell. Everything else comes from the pinned WinLibs
    # GCC (tools/toolchain/install_winlibs.sh), the one build every Windows exe and the PGO profile set
    # come from; cached under the install script's hash, so a pin change refetches it. Its bin directory
    # also holds cmake, ninja and ccache, which a fresh MSYS2 (msys2/setup-msys2, ~65 s a run) used to
    # install. The build needs python3 too (CMakeLists.txt, tools/ext_rsc_embed.py): actions/setup-python.
    defaults:
      run:
        shell: bash
    env:
      CCACHE_MAXSIZE: 1000M   # the debug object set: dx11 OpenBA, unit, the vulkan backend + dxbc-spirv
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: winlibs
        with:
          path: C:/winlibs-gcc16
          key: winlibs-${{ hashFiles('tools/toolchain/install_winlibs.sh') }}
      - name: Pinned compiler
        if: steps.winlibs.outputs.cache-hit != 'true'
        run: tools/toolchain/install_winlibs.sh C:/winlibs-gcc16
      - name: Pinned compiler on PATH
        run: echo 'C:\winlibs-gcc16\mingw64\bin' >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-
      # The two configures' CMake caches. A fresh configure runs ~176 try-compile checks (SDL's, mostly),
      # ~0.35 s each on this runner: 64 s for each build directory. A restored CMakeCache.txt holds their
      # results, so the configure (tools/build.sh runs it: no build.ninja yet) skips them. Exact key only,
      # over the runner image, every CMake file in the tree (SDL's and the other submodules' included) and
      # the compiler pin: any change to what the checks would find configures from scratch.
      - name: Runner image (part of the CMake cache key)
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            build/cmake-debug/CMakeCache.txt
            build/cmake-debug-vulkan/CMakeCache.txt
          key: cmake-configure-windows-${{ steps.image.outputs.version }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'tools/toolchain/install_winlibs.sh') }}
      - name: Toolchain
        run: |
          command -v g++ cmake ninja ccache python
          g++ --version | head -1
          cmake --version | head -1
          ccache --version | head -1
          ccache -z
      - name: Build OpenBA (debug)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/build.sh build debug
      # The Vulkan backend (docs/vulkan/PLAN.md) in its own build directory: its own sources only
      # (target render-backend, compiled as OpenBA compiles them), not a second whole exe. The rest of
      # that exe is the dx11 configure's, and the Linux job builds and links the whole vulkan OpenBA.
      # Headers only: no Vulkan runtime is needed to build it.
      - name: Build the vulkan backend (debug)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" BANISHED_RENDER_BACKEND=vulkan tools/build.sh backend debug
      # The unit tests, once, on the vulkan configure. Its unit exe is the dx11 configure's plus
      # tests/unit/vulkan_*_test.cpp (the dxbc-spirv shader converter and its SPIR-V cache), which only
      # that configure builds: every other unit object compiles exactly as in the dx11 configure (the
      # backend's include directory reaches its own sources only, CMakeLists.txt). A dx11-configure
      # unit run as well ran the same ~1770 tests a second time (1766 of the vulkan run's 1792).
      - name: Unit tests (debug, vulkan backend)
        run: BANISHED_RENDER_BACKEND=vulkan tools/build.sh unit debug --shards 4
      - name: ccache statistics
        if: always()
        run: ccache -s

  linux:
    name: Linux (Ubuntu 24.04, dxvk-native)   # the required-check name: kept, though the renderer is Vulkan since P5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 800M
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libegl-dev \
            libdecor-0-dev libasound2-dev libpulse-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      # The configure's CMake cache: its try-compile results (SDL's, mostly), as on Windows above.
      - name: Runner image (part of the CMake cache key)
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: build/cmake-debug/CMakeCache.txt
          key: cmake-configure-linux-${{ steps.image.outputs.version }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Zero the ccache statistics
        run: ccache -z
      # The default configure is the Vulkan backend off Windows (Vulkan P5), so this one build and
      # unit run include tests/unit/vulkan_*_test.cpp. Headers only: no Vulkan runtime is needed.
      - name: Build OpenBA (debug)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/build.sh build debug
      # The witness that the default configure really is the Vulkan backend (and that it is ready:
      # every submodule it needs came with the non-recursive checkout above).
      - name: Default backend is vulkan
        run: |
          grep -q '^BANISHED_RENDER_BACKEND:STRING=vulkan$' build/cmake-debug/CMakeCache.txt
          test -x build/cmake-debug/OpenBA
      - name: Unit tests (debug)
        run: tools/build.sh unit debug --shards 4
      - name: ccache statistics
        if: always()
        run: ccache -s

  macos:
    name: macOS (arm64, Metal)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 800M
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      # No `brew update` and no cleanup pass: the two packages come from the runner image's tap.
      - name: Packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install ninja ccache
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-
      # The configure's CMake cache: its try-compile results (SDL's, mostly), as on Windows above.
      - name: Runner image (part of the CMake cache key)
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: build/mac-arm64/CMakeCache.txt
          key: cmake-configure-macos-${{ steps.image.outputs.version }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Zero the ccache statistics
        run: ccache -z
      # The engine only; libairconv.dylib (tools/macos/setup_deps.sh, an LLVM build) is dlopened at
      # run time and not needed to compile or link it.
      - name: Build OpenBA (debug)
        run: |
          CMAKE_EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 $CCACHE_LAUNCHERS" \
            tools/build.sh build debug
      # Hang watchdog: a unit test that deadlocks otherwise burns the 60-minute job limit and leaves no
      # trace. After 12 minutes every thread's stack of every unit process still running is sampled
      # (`sample`), printed, and the run fails.
      - name: Unit tests (debug)
        run: |
          tools/build.sh unit debug --shards 3 &
          pid=$!
          for i in $(seq 1 144); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::unit still running after 12 minutes: thread stacks follow"
            for upid in $(pgrep -x unit); do
              sample "$upid" 2 -mayDie -file "/tmp/unit.$upid.sample" || true
              cat "/tmp/unit.$upid.sample" || true
              kill -9 "$upid" 2>/dev/null || true
            done
            kill -9 "$pid" 2>/dev/null || true
            exit 1
          fi
          wait "$pid"
      - name: ccache statistics
        if: always()
        run: ccache -s

  # The Android app (debug apk: libmain.so through the NDK, SDL's Java glue), so a seam the desktop
  # builds do not compile (src/platform/android, src/diag/android, an ARM ABI guard) breaks here and
  # not on the phone. NOT one of the four required checks (AGENTS.md section 7): branch protection
  # names those, and making this a fifth is the owner's call. Pins as release.yml's android job.
  android:
    name: Android (arm64, debug apk)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 600M
      ANDROID_NDK_PIN: "30.0.16248370"
      ANDROID_CMAKE_PIN: "3.31.6"
      ANDROID_PLATFORM_PIN: "android-35"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;$ANDROID_PLATFORM_PIN" "ndk;$ANDROID_NDK_PIN" "cmake;$ANDROID_CMAKE_PIN" > /dev/null
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-
      - name: Zero the ccache statistics
        run: ccache -z
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-
      - name: Build the debug apk
        run: tools/android.sh build debug --jobs "$BUILD_JOBS" --ccache
      - name: ccache statistics
        if: always()
        run: ccache -s

  acceptance:
    name: Acceptance (no doors)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: tools/acceptance/acceptance.sh
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(command -v python3)" "$RUNNER_TEMP/bin/python"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          tools/acceptance/acceptance.sh
