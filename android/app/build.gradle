// android/app/build.gradle -- the OpenBA app module (docs/android/README.md).
//
// Java: one activity (OpenBAActivity, a subclass of SDL's SDLActivity) plus SDL's own Android
// glue, compiled from the pinned SDL submodule in place (third_party/SDL/android-project), so the
// Java side always matches the C side it calls. Native: the repository's root CMakeLists.txt,
// configured by the NDK for arm64-v8a only; it builds libmain.so (the game, target OpenBA) and
// libSDL3.so (target SDL3-shared). The app carries no game data: WinData/ is pushed by the user
// into the app's data folder (docs/android/README.md, AGENTS.md section 1). It does carry the
// typeface the desktop packages ship, FrancophilSans (third-party, its licence beside it,
// THIRD_PARTY_NOTICES.md): tools/release/fonts is an assets folder, and OpenBAActivity copies the
// three files into the data folder at start when they are absent (ext.sharp_ui reads them there).

plugins {
    id 'com.android.application'
}

def sdlJava = file('../../third_party/SDL/android-project/app/src/main/java')
def releaseFonts = file('../../tools/release/fonts')   // the desktop packages' font folder, used in place

// -Popenba.nativeJobs=N caps the native compile at N jobs (tools/android.sh passes --jobs /
// BUILD_JOBS, as tools/build.sh does); unset, ninja uses every core.
def nativeJobArgs = []
if (project.hasProperty('openba.nativeJobs')) {
    def jobs = project.property('openba.nativeJobs')
    nativeJobArgs = ["-DCMAKE_JOB_POOLS=openba_jobs=${jobs}", '-DCMAKE_JOB_POOL_COMPILE=openba_jobs',
                     '-DCMAKE_JOB_POOL_LINK=openba_jobs']
}

// -Popenba.ccache=true (tools/android.sh build --ccache; the release workflow) compiles the native
// part through ccache on PATH, C and C++; unset, the build leaves ccache off as before.
def ccacheArgs = ['-DBANISHED_USE_CCACHE=OFF']
if (project.hasProperty('openba.ccache') && project.property('openba.ccache') == 'true') {
    ccacheArgs = ['-DBANISHED_USE_CCACHE=ON', '-DCMAKE_C_COMPILER_LAUNCHER=ccache']
}

// -Popenba.pgo=generate|use|off (tools/android.sh build --pgo ...; perf/pgo/android/README.md) is
// CMake's BANISHED_PGO for the native part; unset, CMake's `auto` (the release flavour uses the
// merged profile when perf/pgo/android/openba.profdata exists).
def pgoArgs = []
if (project.hasProperty('openba.pgo')) {
    pgoArgs = ["-DBANISHED_PGO=${project.property('openba.pgo')}"]
}

// The version is the root CMakeLists.txt's `project(... VERSION x.y.z)`, as for the desktop
// packages (the release workflow's tag check reads the same line): versionName x.y.z, versionCode
// x * 10000 + y * 100 + z, so a release bump is the one CMake edit.
def cmakeVersion = (file('../../CMakeLists.txt').text =~ /project\([^)]*VERSION (\d+)\.(\d+)\.(\d+)/)
if (!cmakeVersion.find()) {
    throw new GradleException('no project(... VERSION x.y.z) in CMakeLists.txt')
}
def versionParts = [cmakeVersion.group(1), cmakeVersion.group(2), cmakeVersion.group(3)].collect { it as int }

android {
    namespace = 'org.openba.game'
    compileSdk = 35
    ndkVersion = '30.0.16248370'

    defaultConfig {
        applicationId = project.property('openba.applicationId')
        resValue 'string', 'app_name', project.property('openba.appName')
        minSdk = 29
        targetSdk = 35
        versionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName = versionParts.join('.')
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // c++_shared: libmain.so and libSDL3.so share one C++ runtime (libc++_shared.so).
                arguments '-DANDROID_STL=c++_shared', '-DBANISHED_RENDER_BACKEND=vulkan',
                          *ccacheArgs, *nativeJobArgs, *pgoArgs
                targets 'OpenBA', 'SDL3-shared'
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DBANISHED_FLAVOUR=debug'
                }
            }
        }
        release {
            // Unsigned here: tools/android.sh sign aligns and signs it (P8; the release workflow
            // signs with the release key from the repository's secrets, docs/android/README.md).
            // P12: the release flavour, as the desktop packages (-O3; ThinLTO and the clang profile
            // when perf/pgo/android/openba.profdata exists, CMakeLists.txt). Gradle's RelWithDebInfo
            // keeps -g, so the unstripped library under build/intermediates still symbolises a crash
            // log or a simpleperf profile; the apk carries the stripped copy. The perf flavour
            // (-O2 -g, the perf baselines' build) is `-Popenba.flavour=perf`.
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments "-DBANISHED_FLAVOUR=${project.hasProperty('openba.flavour') ? project.property('openba.flavour') : 'release'}"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJava
            assets.srcDirs += releaseFonts
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}
